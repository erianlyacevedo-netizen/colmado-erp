appId: do.colmado.erp
productName: Colmado ERP
artifactName: Colmado-ERP-Setup-${version}.${ext}
directories:
  output: dist
files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/setup.html
  - desktop/setup.js
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: desktop-runtime
    to: runtime
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
