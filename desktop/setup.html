<!doctype html><html lang="es"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><title>Colmado ERP — Configuración</title><style>body{font:16px system-ui;background:#eef2f6;color:#172333;max-width:440px;margin:55px auto}main{background:white;padding:30px;border-radius:15px}label,input{display:block;width:100%;box-sizing:border-box}input{padding:12px;margin:6px 0 18px;border:1px solid #aab4c0;border-radius:7px}button{background:#176345;color:white;padding:13px;border:0;border-radius:7px;width:100%;font-weight:bold}#msg{color:#a22}</style><main><h1>Colmado ERP</h1><p>Configura tu negocio y crea el propietario. Los datos se guardarán en esta computadora.</p><form id="form"><label>Nombre del negocio<input id="business" required maxlength="120"></label><label>Correo<input id="email" type="email" required maxlength="200"></label><label>Contraseña (mínimo 12 caracteres)<input id="password" type="password" required minlength="12" maxlength="72"></label><button id="submit">Crear negocio y abrir</button><p id="msg" role="status"></p></form></main><script src="setup.js"></script></html>
